name: Build Sonos v0.5 APK
on:
  push:
    branches: [sonos-apk-build-test-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack Sonos app v0.4 base
        run: |
          mkdir -p sonos_v05/android
          base64 --decode sonos_v04/android_source.tar.xz.b64 | tar -xJ -C sonos_v05/android
          cp sonos_v05/MainActivity.java sonos_v05/android/app/src/main/java/be/vantique/mijnmuzieksonos/MainActivity.java
          cp sonos_v05/SonosApi.java sonos_v05/android/app/src/main/java/be/vantique/mijnmuzieksonos/SonosApi.java
          sed -i 's/versionCode 4/versionCode 5/;s/0.4-mappen-afspeellijsten/0.5-automatisch-afspelen/' sonos_v05/android/app/build.gradle
      - name: Compile APK
        working-directory: sonos_v05/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-v0.5-APK
          path: sonos_v05/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Windows project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sonos_v05/windows | Out-Null
          $encoded = [IO.File]::ReadAllText((Resolve-Path sonos_v04/windows_source.tar.xz.b64))
          [IO.File]::WriteAllBytes("sonos_v05/windows_source.tar.xz",[Convert]::FromBase64String($encoded))
          tar -xf sonos_v05/windows_source.tar.xz -C sonos_v05/windows
          Copy-Item sonos_v05/sonos_windows.py sonos_v05/windows/sonos_windows.py -Force
          $iss="sonos_v05/windows/windows-installer.iss"
          (Get-Content -Raw $iss).Replace("0.4.0","0.5.0").Replace("Setup_v0.4","Setup_v0.5") | Set-Content -Encoding utf8 $iss
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Compile Windows app
        working-directory: sonos_v05/windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MijnMuziekNaarSonos sonos_windows.py
      - name: Build Windows installer
        working-directory: sonos_v05/windows
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup not found' }
          & $compiler 'windows-installer.iss'
      - name: Publish Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-v0.5-Windows-Setup
          path: sonos_v05/windows/dist/Mijn_Muziek_naar_Sonos_Windows_Setup_v0.5.exe
          if-no-files-found: error
          retention-days: 7
