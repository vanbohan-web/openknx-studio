name: Build Sonos v0.4 APK
on:
  push:
    branches: [sonos-apk-build-test-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "sdkmanager=$SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack Sonos app
        shell: bash
        run: |
          mkdir -p sonos_v04/android
          base64 --decode sonos_v04/android_source.tar.xz.b64 | tar -xJ -C sonos_v04/android
      - name: Build installable debug APK
        working-directory: sonos_v04/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-v0.4-APK
          path: sonos_v04/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
