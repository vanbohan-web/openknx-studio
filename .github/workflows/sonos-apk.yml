name: Compile Sonos APK
on:
  push:
    branches:
      - sonos-apk-build-test-20261018
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract existing app
        run: |
          mkdir -p "$RUNNER_TEMP/sonos-source"
          base64 -d sonos-apk-build/source.tar.xz.base64 | tar -xJ -C "$RUNNER_TEMP/sonos-source"
          test -f "$RUNNER_TEMP/sonos-source/app/build.gradle"
      - name: Compile debug APK
        run: gradle -p "$RUNNER_TEMP/sonos-source" --no-daemon assembleDebug
      - name: Show and checksum result
        run: |
          file "$RUNNER_TEMP/sonos-source/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$RUNNER_TEMP/sonos-source/app/build/outputs/apk/debug/app-debug.apk"
      - name: Share APK
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-naar-Sonos-test-APK
          path: ${{ runner.temp }}/sonos-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
