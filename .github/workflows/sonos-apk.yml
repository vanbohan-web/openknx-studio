name: Compile Sonos APK
on:
  push:
    branches:
      - sonos-apk-build-test-20261018
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command line tools and platform 36
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/android-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract existing app
        run: |
          mkdir -p "$RUNNER_TEMP/sonos-source"
          base64 -d sonos-apk-build/source.tar.xz.base64 | tar -xJ -C "$RUNNER_TEMP/sonos-source"
          test -f "$RUNNER_TEMP/sonos-source/app/build.gradle"
      - name: Compile debug APK
        run: gradle -p "$RUNNER_TEMP/sonos-source" --no-daemon assembleDebug
      - name: Show and checksum result
        run: |
          file "$RUNNER_TEMP/sonos-source/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$RUNNER_TEMP/sonos-source/app/build/outputs/apk/debug/app-debug.apk"
      - name: Share APK
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-naar-Sonos-test-APK
          path: ${{ runner.temp }}/sonos-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
