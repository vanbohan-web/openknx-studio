name: Sonos v0.4 Android and Windows installers
on:
  push:
    branches: [sonos-apk-build-test-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p sonos_v04/android
          base64 -d sonos_v04/android_source.tar.xz.b64 | tar -xJ -C sonos_v04/android
      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Compile Android v0.4
        working-directory: sonos_v04/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-Android-v0.4
          path: sonos_v04/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Windows project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sonos_v04/windows | Out-Null
          $b64 = [System.IO.File]::ReadAllText("sonos_v04/windows_source.tar.xz.b64")
          $b64 = $b64 -replace '\s',''
          [System.IO.File]::WriteAllBytes("sonos_v04/windows-source.tar.xz", [Convert]::FromBase64String($b64))
          tar.exe -xJf sonos_v04/windows-source.tar.xz -C sonos_v04/windows
      - name: Compile Windows standalone exe
        shell: pwsh
        working-directory: sonos_v04/windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MijnMuziekNaarSonos sonos_windows.py
          if (!(Test-Path "dist/MijnMuziekNaarSonos.exe")) { throw "Windows executable ontbreekt" }
      - name: Build Windows installer
        shell: pwsh
        working-directory: sonos_v04/windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup ontbreekt" }
          & $iscc "windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler faalde" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-Windows-Setup-v0.4
          path: sonos_v04/windows/dist/Mijn_Muziek_naar_Sonos_Windows_Setup_v0.4.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload standalone Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Muziek-Naar-Sonos-Windows-Portable-v0.4
          path: sonos_v04/windows/dist/MijnMuziekNaarSonos.exe
          if-no-files-found: error
          retention-days: 30
